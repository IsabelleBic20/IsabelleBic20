name: Charts and Cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "assets/langmix.json"
      - "assets/projects.json"
      - "scripts/**"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate animated terminal banners
        run: python scripts/banner/generate.py

      - name: Generate Skill Radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar --values

      - name: Generate Language & Tech Radar
        run: python scripts/radar.py --data assets/langmix.json -o assets/radar-langs --values

      - name: Generate GitHub Stats and Repo Cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cards.py \
            --user "${{ github.repository_owner }}" \
            --projects assets/projects.json \
            --out assets

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: refresh profile SVGs and charts [skip ci]"
          git push
