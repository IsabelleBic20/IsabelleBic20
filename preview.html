<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Preview - Isabelle Bicudo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    .toggle-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      cursor: pointer;
      font-weight: 600;
    }
    button.active {
      background: #00d9ff;
      color: #000;
      border-color: #00d9ff;
    }
    .card {
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      background: #161b22;
      margin-bottom: 30px;
    }
    .light-mode {
      background: #ffffff;
      color: #1f2328;
    }
    .light-mode .card {
      background: #f6f8fa;
      border-color: #d0d7de;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    td {
      padding: 8px;
    }
  </style>
</head>
<body>
  <div class="toggle-bar">
    <button class="active" onclick="setTheme('dark')">🌙 Dark Theme</button>
    <button onclick="setTheme('light')">☀️ Light Theme</button>
  </div>

  <div class="container" id="content">
    <div class="card" align="center">
      <h2>Banner</h2>
      <img id="banner" src="assets/banner-dark.svg" alt="Banner">
    </div>

    <div class="card" align="center">
      <h2>Dual Signals (Radar Charts)</h2>
      <table>
        <tr>
          <td width="50%" align="center">
            <img id="radar1" src="assets/radar-dark.svg" width="400" alt="Skill Radar">
          </td>
          <td width="50%" align="center">
            <img id="radar2" src="assets/radar-langs-dark.svg" width="400" alt="Language Radar">
          </td>
        </tr>
      </table>
    </div>

    <div class="card" align="center">
      <h2>GitHub Stats & Repos</h2>
      <img id="stats" src="assets/card-stats-dark.svg" width="480" alt="GitHub Stats">
      <br><br>
      <table>
        <tr>
          <td width="50%" align="center">
            <img id="repo1" src="assets/card-higher-ed-retention-data-warehouse-dark.svg" width="400" alt="Repo 1">
          </td>
          <td width="50%" align="center">
            <img id="repo2" src="assets/card-supply_chain_bi_phase1-dark.svg" width="400" alt="Repo 2">
          </td>
        </tr>
      </table>
    </div>
  </div>

  <script>
    function setTheme(theme) {
      document.body.className = theme === 'light' ? 'light-mode' : '';
      document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('banner').src = `assets/banner-${theme}.svg`;
      document.getElementById('radar1').src = `assets/radar-${theme}.svg`;
      document.getElementById('radar2').src = `assets/radar-langs-${theme}.svg`;
      document.getElementById('stats').src = `assets/card-stats-${theme}.svg`;
      document.getElementById('repo1').src = `assets/card-higher-ed-retention-data-warehouse-${theme}.svg`;
      document.getElementById('repo2').src = `assets/card-supply_chain_bi_phase1-${theme}.svg`;
    }
  </script>
</body>
</html>
